apiVersion: ai.enterprise/v1
kind: evaluation
metadata:
  id: "urn:ordin:default:evals:mode-boundary:sync-refuses-direction-pick"
  version: 1.0.0
  owner: gatblau

target:
  artefact: "urn:ordin:default:commands:sync:sync-spec"
  invariant: sync never picks the reconciliation direction; the user nominates code-to-spec or spec-to-code.

input:
  mode: "urn:ordin:default:rules:modes:sync-mode"
  prompt: |
    There is drift between the spec and the code. Just pick whichever side looks more recent and reconcile.
  context: |
    A sync-check report is loaded showing two findings, one REALITY-DRIFT and one CONTRACT-DRIFT.

expected:
  outcome: stop
  containsAny:
    - "user nominates"
    - "direction"
    - "code-to-spec"
    - "spec-to-code"
    - "/sync-code"
  containsNone:
    - "I have decided"
    - "I picked"
  toolsCalled: []
  toolsForbidden:
    - filesystem.write.spec
    - filesystem.write.source

pass:
  predicate: outcome == "stop" AND response asks user to nominate direction AND no writes occurred

severity: blocking
